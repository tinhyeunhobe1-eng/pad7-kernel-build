name: KSU Next + SuSFS — Pad7 (uke)
run-name: ✅ Pad7 | KSU Next + SuSFS 🚀

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: '🔌 Chọn Nguồn Kernel'
        required: true
        default: 'gki'
        type: choice
        options:
          - gki
          - xiaomi
      ksun_branch:
        description: 'KernelSU Next phiên bản'
        required: true
        default: 'next'
        type: choice
        options: [ next, dev, stable ]

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 Cài công cụ
        run: |
          sudo apt update && sudo apt install -y git build-essential bc bison flex \
            libssl-dev libelf-dev cpio lz4 zstd ccache gcc-aarch64-linux-gnu \
            clang llvm lld zip python3 patch curl

      - name: 📥 TẢI SOURCE KERNEL
        run: |
          if [ "${{ inputs.source_type }}" = "gki" ]; then
            git clone --depth=1 -b android14-6.1 \
              https://android.googlesource.com/kernel/common.git kernel
            cd kernel
            echo "✅ Source GKI android14-6.1"
          else
            git clone --depth=1 -b uke-v-oss \
              https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
            cd kernel
            echo "✅ Source Xiaomi uke-v-oss"
          fi
          head -n5 Makefile
          # Liệt kê các defconfig có sẵn
          echo "📋 Các defconfig tìm thấy:"
          find arch/arm64/configs -name "*defconfig" | grep -E "6.1|gki|android14|common" | sort

      - name: 🔌 Tích hợp KernelSU Next
        run: |
          cd kernel
          KSU_DIR=KernelSU-Next
          git clone --depth=1 -b ${{ inputs.ksun_branch }} \
            https://github.com/KernelSU-Next/KernelSU-Next.git $KSU_DIR || \
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git $KSU_DIR
          
          if [ ! -d "$KSU_DIR" ]; then
            echo "❌ Không tải được KernelSU Next"
            exit 1
          fi
          echo "✅ KernelSU Next đã tải"
          
          # Thêm KSU vào Makefile
          if ! grep -q "KernelSU-Next" Makefile; then
            echo "obj-\$(CONFIG_KSU) += $KSU_DIR/" >> Makefile
          fi

      - name: 🧩 Áp dụng SuSFS Patch
        run: |
          cd kernel
          git clone --depth=1 -b gki-android14-6.1 https://gitlab.com/simonpunk/susfs4ksu.git susfs || true
          if [ -d susfs ]; then
            cp -p susfs/kernel_patches/fs/* fs/ 2>/dev/null || true
            cp -p susfs/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
            cd KernelSU-Next
            patch -p1 < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch 2>/dev/null || true
            cd ..
            patch -p1 < susfs/kernel_patches/50_add_susfs_in_kernel-gki-android14-6.1.patch 2>/dev/null || true
            echo "✅ SuSFS patch đã áp dụng"
          else
            echo "⚠️ Không tải được SuSFS — tiếp tục build chỉ KSU"
          fi

      - name: ⚙️ Cấu hình Kernel — ĐÃ SỬA LỖI defconfig
        run: |
          cd kernel
          
          # Tìm defconfig phù hợp nhất
          if [ -f arch/arm64/configs/gki_defconfig ]; then
            DEFCONFIG=gki_defconfig
          elif [ -f arch/arm64/configs/defconfig ]; then
            DEFCONFIG=defconfig
          else
            DEFCONFIG=defconfig
          fi
          
          echo "✅ Sử dụng: $DEFCONFIG"
          
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 $DEFCONFIG
          
          # Bật KSU + SuSFS
          cat >> .config << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KSU_SYSCTL=y
          CONFIG_KSU_WITH_KPROBES=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          CONFIG_DEBUG_INFO=n
          EOF
          
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          echo "✅ Cấu hình hoàn tất"

      - name: 🔨 Biên dịch
        run: |
          cd kernel
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc) 2>&1 | tee build.log
          ls -lh arch/arm64/boot/Image

      - name: 📦 Đóng gói AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3 && rm -rf .git
          cp ../kernel/arch/arm64/boot/Image ./Image
          cat >> anykernel.sh << 'EOF'
          do.devicecheck=1
          device.name=uke
          device.name=pad7
          kernel.version=6.1-android14
          ksu.next=true
          susfs.enabled=true
          EOF
          zip -r9 ../KSU-Next-SuSFS-Pad7-UKE.zip ./*
          cd .. && ls -lh KSU-Next-SuSFS-Pad7-UKE.zip

      - name: 📤 Upload kết quả
        uses: actions/upload-artifact@v4
        with:
          name: KSU-Next-SuSFS-Pad7
          path: |
            KSU-Next-SuSFS-Pad7-UKE.zip
            kernel/.config
            kernel/build.log
          retention-days: 30
