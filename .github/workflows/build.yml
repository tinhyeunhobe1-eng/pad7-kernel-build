name: KernelSU Next + SUSFS
run-name: Đang xây dựng... 🚀
on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Tải nguồn Kernel
        run: |
          git clone --depth=1 --branch shennong-u-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          cd kernel
          ls arch/arm64/configs/

      - name: 🔧 Cài công cụ
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git bc bison build-essential gcc-aarch64-linux-gnu libelf-dev zip

      - name: 🧠 Thêm KernelSU Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: ⚙️ Tìm & đặt cấu hình
        run: |
          cd kernel
          # Tìm file cấu hình phù hợp
          DEFCFG=$(ls arch/arm64/configs/*shennong* 2>/dev/null || ls arch/arm64/configs/*xiaomi15* 2>/dev/null || ls arch/arm64/configs/*qcom*defconfig 2>/dev/null | head -1)
          echo "Tìm thấy cấu hình: $DEFCFG"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- "$(basename $DEFCFG)"
          # Bật KernelSU
          echo "CONFIG_KSU=y" >> .config

      - name: 🔨 Build Kernel
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: 📤 Tải kết quả
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel/arch/arm64/boot/Image
          retention-days: 60
